{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudarshan PG - Login</title>

    <link rel="stylesheet" href="{% static 'pg/style.css' %}">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-header">
                <div class="login-icon">🏠</div>

                <h1>Sudarshan PG</h1>

                <p>Welcome back</p>
            </div>

            <div class="login-box">

                <h2>Login</h2>

                <p class="login-description">
                    Login to manage your PG account
                </p>

                {% if error %}
                    <div class="error-message">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="input-group">
                        <label for="username">Username</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                </form>

                <div class="login-footer">
                    <a href="{% url 'home' %}">
                        ← Back to Home
                    </a>
                </div>

            </div>

            <p class="copyright">
                © 2026 Sudarshan PG. All Rights Reserved.
            </p>

        </div>

    </div>

</body>
</html>
