<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complaint Box | Sudarshan PG</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .page {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 32px;
            box-shadow:
                0 10px 30px rgba(15,23,42,.05);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            margin-bottom: 18px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .complaints {
            margin-top: 30px;
        }

        .complaint {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 17px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .complaint-title {
            font-weight: 700;
        }

        .complaint-meta {
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 11px;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="page">

    <a
        href="{% url 'user_home' %}"
        class="back"
    >
        ← Back to Dashboard
    </a>


    <div class="card">

        <h1>
            Complaint Box
        </h1>

        <p class="subtitle">
            Report maintenance problems or other issues.
        </p>


        <form method="POST">

            {% csrf_token %}


            <label>
                Complaint Type
            </label>

            <select
                name="complaint_type"
                required
            >

                <option value="">
                    Select complaint type
                </option>

                <option value="Maintenance">
                    Maintenance
                </option>

                <option value="Room">
                    Room Issue
                </option>

                <option value="Electricity">
                    Electricity
                </option>

                <option value="Water">
                    Water
                </option>

                <option value="Food">
                    Food / Mess
                </option>

                <option value="Cleaning">
                    Cleaning
                </option>

                <option value="Internet">
                    Wi-Fi / Internet
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Subject
            </label>

            <input
                type="text"
                name="subject"
                placeholder="Example: Wi-Fi is not working"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Explain your complaint..."
                required
            ></textarea>


            <button type="submit">
                Submit Complaint
            </button>

        </form>


        {% if complaints %}

        <div class="complaints">

            <h2>
                My Complaints
            </h2>


            {% for item in complaints %}

            <div class="complaint">

                <div class="complaint-title">
                    {{ item.subject }}
                </div>

                <div class="complaint-meta">
                    {{ item.complaint_type }}
                    ·
                    {{ item.created_at|date:"d M Y" }}
                </div>

                <div class="status">
                    {{ item.status }}
                </div>

            </div>

            {% endfor %}

        </div>

        {% endif %}

    </div>

</div>

</body>

</html>
