{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Sign Up - Sudarshan PG</title>

    <link rel="stylesheet"
          href="{% static 'pgmanagement/css/style.css' %}">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        Sudarshan PG
    </div>

    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'user_login' %}">
            Login
        </a>

        <a href="{% url 'contact' %}">
            Contact
        </a>

    </div>

</nav>


<section class="login-page">

    <div class="login-card">

        <h1>
            Sudarshan PG
        </h1>

        <h2>
            Create Account
        </h2>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message
                        {% if message.tags %}
                            {{ message.tags }}
                        {% endif %}">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-submit">

                Create Account

            </button>

        </form>


        <p class="signup-text">

            Already have an account?

            <a href="{% url 'user_login' %}">
                Login
            </a>

        </p>


        <a href="{% url 'home' %}"
           class="back-link">

            ← Back to Home

        </a>

    </div>

</section>


<footer class="footer">

    <p>
        © 2026 Sudarshan PG
    </p>

</footer>


</body>
</html>
