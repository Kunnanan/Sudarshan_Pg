{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>User Login - Sudarshan PG</title>

    <link rel="stylesheet" href="{% static 'pgmanagement/css/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Sudarshan PG
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/contact/">Contact</a>

        </div>

    </nav>


    <section class="login-page">

        <div class="login-card">

            <h1>Sudarshan PG</h1>

            <h2>User Login</h2>


            {% if messages %}

            <div class="messages">

                {% for message in messages %}

                <div class="error-message">
                    {{ message }}
                </div>

                {% endfor %}

            </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input type="text" name="username" placeholder="Enter username" required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input type="password" name="password" placeholder="Enter password" required>

                </div>


                <button type="submit" class="login-submit">

                    Login

                </button>

            </form>
            <p style="text-align:center; margin-top:20px; color:#6b7280;">

                Don't have an account?

                <a href="{% url 'signup' %}" style="color:#2563eb; font-weight:bold; text-decoration:none;">

                    Sign Up

                </a>

            </p>

            <a href="/" class="back-link">
                ← Back to Home
            </a>

        </div>

    </section>


    <footer class="footer">

        <p>
            © 2026 Sudarshan PG
        </p>

    </footer>

</body>

</html>
